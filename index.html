<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile EMI Calculator (Rs.)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .calculator-card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 24px;
        }

        h2 {
            color: #1a1a1a;
            font-size: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 6px;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #dde2eb;
            border-radius: 8px;
            font-size: 16px;
            color: #333;
            background-color: #fafbfe;
            transition: border-color 0.2s;
            -webkit-appearance: none;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #059669;
            background-color: #fff;
        }

        .result-container {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            margin-top: 24px;
        }

        .emi-display {
            text-align: center;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px dashed #cbd5e1;
        }

        .emi-display .label {
            font-size: 13px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .emi-display .value {
            font-size: 28px;
            font-weight: 700;
            color: #059669;
            margin-top: 4px;
        }

        .breakdown-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #475569;
            margin-bottom: 8px;
        }

        .breakdown-row:last-child {
            margin-bottom: 0;
            font-weight: 600;
            color: #1e293b;
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <h2>Mobile EMI Calculator</h2>
    
    <div class="input-group">
        <label for="totalCost">Total Mobile Cost (Rs.)</label>
        <input type="number" id="totalCost" value="50000" placeholder="e.g. 50000" oninput="calculateEMI()">
    </div>

    <div class="input-group">
        <label for="downPaymentPercent">Down Payment (%)</label>
        <input type="number" id="downPaymentPercent" value="20" min="0" max="100" placeholder="e.g. 20" oninput="calculateEMI()">
    </div>

    <div class="input-group">
        <label for="interestRate">EMI Interest Rate (% per year)</label>
        <input type="number" id="interestRate" value="14" placeholder="e.g. 14" step="0.1" oninput="calculateEMI()">
    </div>

    <div class="input-group">
        <label for="tenure">Tenure (Months)</label>
        <select id="tenure" onchange="calculateEMI()">
            <option value="3">3 Months</option>
            <option value="6">6 Months</option>
            <option value="9">9 Months</option>
            <option value="12" selected>12 Months</option>
            <option value="18">18 Months</option>
            <option value="24">24 Months</option>
        </select>
    </div>

    <div class="result-container">
        <div class="emi-display">
            <div class="label">Monthly EMI</div>
            <div class="value" id="monthlyEmi">Rs. 0.00</div>
        </div>
        <div class="breakdown-row">
            <span>Loan Principal (Amount Financed):</span>
            <span id="loanPrincipal">Rs. 0.00</span>
        </div>
        <div class="breakdown-row">
            <span>Total Interest Payable:</span>
            <span id="totalInterest">Rs. 0.00</span>
        </div>
        <div class="breakdown-row">
            <span>Total Cost (Phone + Interest):</span>
            <span id="totalOverallCost">Rs. 0.00</span>
        </div>
    </div>
</div>

<script>
function calculateEMI() {
    const totalCost = parseFloat(document.getElementById('totalCost').value) || 0;
    let downPaymentPercent = parseFloat(document.getElementById('downPaymentPercent').value) || 0;
    const annualInterestRate = parseFloat(document.getElementById('interestRate').value) || 0;
    const tenureMonths = parseInt(document.getElementById('tenure').value) || 12;

    if (downPaymentPercent > 100) downPaymentPercent = 100;
    if (downPaymentPercent < 0) downPaymentPercent = 0;

    const downPaymentAmount = (totalCost * downPaymentPercent) / 100;
    const principal = totalCost - downPaymentAmount;
    
    // Formatting helper for Nepalese currency system formatting style
    const formatCurrency = (num) => {
        return 'Rs. ' + num.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    };

    document.getElementById('loanPrincipal').innerText = formatCurrency(principal);

    if (principal <= 0) {
        document.getElementById('monthlyEmi').innerText = "Rs. 0.00";
        document.getElementById('totalInterest').innerText = "Rs. 0.00";
        document.getElementById('totalOverallCost').innerText = formatCurrency(totalCost);
        return;
    }

    let monthlyEmi = 0;
    let totalInterest = 0;

    if (annualInterestRate === 0) {
        monthlyEmi = principal / tenureMonths;
        totalInterest = 0;
    } else {
        const monthlyRate = (annualInterestRate / 12) / 100;
        monthlyEmi = (principal * monthlyRate * Math.pow(1 + monthlyRate, tenureMonths)) / 
                     (Math.pow(1 + monthlyRate, tenureMonths) - 1);
        totalInterest = (monthlyEmi * tenureMonths) - principal;
    }

    const totalOverallCost = totalCost + totalInterest;

    document.getElementById('monthlyEmi').innerText = formatCurrency(monthlyEmi);
    document.getElementById('totalInterest').innerText = formatCurrency(totalInterest);
    document.getElementById('totalOverallCost').innerText = formatCurrency(totalOverallCost);
}

window.onload = calculateEMI;
</script>

</body>
</html>
